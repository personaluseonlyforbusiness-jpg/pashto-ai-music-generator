<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Music Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>AI Music Generator Free Online</h1>
    <p>Transform your ideas into songs instantly!</p>

    <label for="lyrics">Lyrics:</label>
    <textarea id="lyrics" placeholder="Enter your lyrics here..."></textarea>

    <label for="title">Song Title:</label>
    <input type="text" id="title" placeholder="Enter the song title">

    <label for="style">Style:</label>
    <select id="style">
      <option value="pop">Pop</option>
      <option value="rock">Rock</option>
      <option value="hiphop">Hip Hop</option>
    </select>

    <button id="generateBtn">Generate</button>

    <div id="output"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
